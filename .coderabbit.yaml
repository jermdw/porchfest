# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: "2"
language: "en-US"
tone_instructions: "Be direct, concise, and prioritize security, React 19 best practices, and Firebase rule safety."

reviews:
  auto_review:
    enabled: true
    drafts: false
  
  high_level_summary: true
  poem: false
  sequence_diagrams: true
  
  # Allowlist: once any non-"!" pattern is present, only matching paths are
  # reviewed. Scoped to the app code that actually carries risk (React/
  # Firebase client, Cloud Functions) -- everything else (scripts/, docs,
  # data/, public/, the sign-tower/print tooling, etc.) is skipped.
  path_filters:
    - "src/**"
    - "functions/**"
    - "!src/assets/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.lock"
    - "!**/package-lock.json"

  instructions: |
    - We use React 19, TypeScript, Tailwind CSS v4, and Firebase.
    - Check for Firebase security rules, Firestore query efficiency, and permission leaks.
    - Flag any accidental hardcoded API secrets or private config keys.
    - Ensure accessibility (ARIA, semantic HTML) on all interactive UI components.
    - Check for proper cleanup of listeners/unsubscribes in useEffect hooks.

chat:
  auto_reply: true
