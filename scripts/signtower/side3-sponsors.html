<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PorchFest Sign Tower — Side 3: Sponsors</title>
<style>
@font-face{font-family:'League Gothic';font-weight:400;font-style:normal;src:url('fonts/league-gothic-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-weight:500;font-style:normal;src:url('fonts/oswald-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-weight:600;font-style:normal;src:url('fonts/oswald-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-weight:700;font-style:normal;src:url('fonts/oswald-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'Yellowtail';font-weight:400;font-style:normal;src:url('fonts/yellowtail-latin-400-normal.woff2') format('woff2');}
@page { size: 48in 96in; margin: 0; }
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --ink:#101d3a; --flag:#c00000; --flag-deep:#a80000; --flag-bright:#c00000;
  --pale:#cdd3e8; --paper:#ffffff;
}
html,body{ width:48in; height:96in; background:var(--ink); }
.banner{
  position:relative; width:48in; height:96in; overflow:hidden;
  background:var(--ink); color:var(--paper);
  font-family:'Oswald',"Arial Narrow",sans-serif;
  display:flex; flex-direction:column;
}
.topband{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:0.4in; padding:1.35in 4in 0; text-align:center; }
.lockup{ --lockup-cap:5.4in; }
.title{ font-weight:700; font-size:2.9in; letter-spacing:0.02em; margin-top:0.35in; }
.rule{ width:16in; height:0.07in; background:var(--flag-bright); margin-top:0.22in; }

.main{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; gap:0.62in; padding:1.0in 4in 0; }

.tier-label{ font-weight:600; font-size:1.1in; letter-spacing:0.14em; color:var(--flag-bright); text-transform:uppercase; }
.card-row{ display:flex; flex-wrap:wrap; justify-content:center; align-items:stretch; gap:0.7in; width:100%; }
.card{
  background:var(--paper); border-radius:0.4in; display:flex; align-items:center; justify-content:center;
  padding:0.55in 0.75in;
}
.card.dark{ background:var(--ink); border:0.05in solid var(--pale); }
/* Letterbox: the card is the fixed shape, the logo fits inside it whatever its
   aspect. Cards used to size only by width and let height follow the logo,
   which broke the tier ladder in both directions -- silver's wide, short
   lockups (Renewal by Andersen, Guiding Light) came out SHORTER than the
   square-ish porch logos below them, and gold's square logos came out TALLER
   than the wide title-tier ones above. A sponsor's tier has to be legible from
   card size alone, so both dimensions are now declared and both decrease
   monotonically down the wall. */
/* width/height 100% + contain, NOT max-width/auto: with auto dimensions the img
   falls back to its intrinsic pixel size, and these are 400px web assets, so
   every logo collapsed to a stamp in the middle of its card. */
.card img{ display:block; width:100%; height:100%; object-fit:contain; }

/* Widths are capped by how many cards share a row inside the 40in column
   (48in panel less 2x4in padding); heights are then free, and are what carry
   the tier hierarchy. Row budgets, gap included:
     title  2 x 14.5 + 0.7  = 29.7    gold   4 x 9.4 + 3x0.7 = 39.7
     silver 4 x  8.4 + 3x0.7 = 35.7   porch  5 x 7.2 + 4x0.5 = 38.0
   Go wider than these and a row wraps one card onto a line of its own. */
.presenting .card{ width:22in;   height:9.6in; }
.vip .card{         width:17.5in; height:8.0in; }
.title-tier .card{  width:14.5in; height:6.8in; }
.gold .card{        width:9.4in;  height:5.4in; }
.silver .card{      width:8.4in;  height:4.6in; }
.porch .card, .kids .card{ width:7.2in; height:4.0in; padding:0.22in 0.4in; }
.porch .card-row, .kids .card-row{ gap:0.5in; }
.gold .card.textonly{ color:var(--ink); font-weight:700; font-size:1.7in; line-height:1.15; text-align:center; letter-spacing:0.01em; }
.porch .card.textonly, .kids .card.textonly{
  display:flex; align-items:center; justify-content:center; color:var(--ink);
  font-weight:600; font-size:0.95in; text-align:center; letter-spacing:0.02em;
}

.section-group{ width:100%; text-align:center; margin-top:0.15in; }
.section-group .tier-label{ margin-bottom:0.3in; }


.presented{ font-weight:500; font-size:1.4in; letter-spacing:0.05em; color:var(--pale); text-transform:uppercase; text-align:center; margin-top:0.4in; }
.closing-rule{ width:16in; height:0.07in; background:var(--flag-bright); margin:0.4in auto 0.5in; }

/* --- 2026 lockup ------------------------------------------------------- */
/* Replaces the arched "PorchFest 2026" wordmark. Set in League Gothic, which
   is what the 2026 ad banners use: matched letterform-for-letterform against
   them, and 5% off on SENOIA'S at equal cap height. (Their PORCHFEST is that
   same face squashed to ~71% to survive a 90px-tall ad slot -- not reproduced
   here, because a 48in panel has all the width it needs and squashed type
   reads as a mistake at this size.) */
.lockup{ font-family:'League Gothic','Oswald',"Arial Narrow",sans-serif;
  text-transform:uppercase; text-align:center; line-height:0.88;
  color:var(--paper); display:block; }
.lockup .lk-top{ font-size:calc(var(--lockup-cap) * 0.40); letter-spacing:0.005em;
  display:block; white-space:nowrap; }
.lockup .lk-yr{ color:var(--flag-bright); }
.lockup .lk-yr sup{ font-size:0.62em; vertical-align:baseline;
  position:relative; top:-0.42em; }
.lockup .lk-main{ font-size:var(--lockup-cap); letter-spacing:0.004em;
  display:block; white-space:nowrap; }
</style>
</head>
<body>
<div class="banner" data-side="3-sponsors">

<div class="lockup">

        <div class="card dark"><img src="../../src/assets/sponsor-senoia-bicycle.webp" alt="Senoia Bicycle" /></div>
