<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PorchFest Sign Tower — Side 1 (alt): Guitar-led</title>
<style>
@font-face{font-family:'League Gothic';font-weight:400;font-style:normal;src:url('fonts/league-gothic-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-weight:500;font-style:normal;src:url('fonts/oswald-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-weight:600;font-style:normal;src:url('fonts/oswald-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Oswald';font-weight:700;font-style:normal;src:url('fonts/oswald-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'Yellowtail';font-weight:400;font-style:normal;src:url('fonts/yellowtail-latin-400-normal.woff2') format('woff2');}
@page { size: 48in 96in; margin: 0; }
* { margin:0; padding:0; box-sizing:border-box; }
:root{
  --ink:#101d3a; --flag:#c00000; --flag-deep:#a80000; --flag-bright:#c00000;
  --pale:#cdd3e8; --paper:#ffffff;
}
html,body{ width:48in; height:96in; background:var(--ink); }
.banner{
  position:relative; width:48in; height:96in; overflow:hidden;
  background:var(--ink); color:var(--paper);
  font-family:'Oswald',"Arial Narrow",sans-serif;
  display:flex; flex-direction:column;
}
/* Guitar-led composition, after the (160 x 600) ad banner: the instrument owns
   the top of the panel and bleeds off the trim, with the whole type block
   sitting under it. The ad is 1:3.75 and this panel is 1:2, so the proportions
   are re-cut rather than copied -- a literal scale-up would leave the guitar a
   thin stripe with two thirds of the panel empty beneath it. */
.main{
  flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:1.1in; padding:0 4in 0; text-align:center;
}
.guitarwrap{
  width:100%; height:53in; overflow:hidden; display:flex; justify-content:center;
  margin-bottom:0.6in;
}
/* Negative top margin crops the headstock at the trim edge; the dove and the
   flag body -- the parts that carry the mark -- stay fully on the panel. */
.guitarwrap img{ width:38in; height:auto; display:block; margin-top:-6.8in; }
.eyebrow{ font-family:'Yellowtail',cursive; font-size:3.8in; line-height:1; color:var(--flag-bright); }
.lockup{ --lockup-cap:11.6in; }
.subline{ font-weight:600; font-size:3.0in; line-height:1.2; color:var(--pale); letter-spacing:0.05em; }
.badge{
  display:inline-block; background:var(--flag); color:var(--paper);
  font-weight:700; font-size:1.9in; letter-spacing:0.12em;
  padding:0.45in 1.25in; border-radius:0.3in;
}
.bottom-credits{ display:flex; flex-direction:column; align-items:center; gap:0.8in; margin-top:auto; padding-top:0.9in; }
.rule{ width:19in; height:0.07in; background:var(--flag-bright); }
.tagline{ font-family:'Yellowtail',cursive; font-size:2.5in; line-height:1.1; color:var(--paper); }
.presented{ font-weight:500; font-size:1.15in; letter-spacing:0.06em; color:var(--pale); text-transform:uppercase; }

.footer{
  flex:0 0 12.5in; display:flex; align-items:center; justify-content:center; gap:2.2in;
  padding:0 4in; border-top:0.12in solid var(--flag); margin-top:1.5in;
}
.qrbox{ width:6.6in; height:6.6in; background:var(--paper); border-radius:0.5in; padding:0.6in; }
.qrbox img, .qrbox svg{ width:100%; height:100%; display:block; }
.footcopy{ text-align:left; }
.foot-url{ font-weight:700; font-size:1.95in; letter-spacing:0.02em; }
.foot-caption{ font-weight:500; font-size:1.0in; color:var(--pale); margin-top:0.3in; }

/* --- 2026 lockup ------------------------------------------------------- */
/* Replaces the arched "PorchFest 2026" wordmark. Set in League Gothic, which
   is what the 2026 ad banners use: matched letterform-for-letterform against
   them, and 5% off on SENOIA'S at equal cap height. (Their PORCHFEST is that
   same face squashed to ~71% to survive a 90px-tall ad slot -- not reproduced
   here, because a 48in panel has all the width it needs and squashed type
   reads as a mistake at this size.) */
.lockup{ font-family:'League Gothic','Oswald',"Arial Narrow",sans-serif;
  text-transform:uppercase; text-align:center; line-height:0.88;
  color:var(--paper); display:block; }
.lockup .lk-top{ font-size:calc(var(--lockup-cap) * 0.40); letter-spacing:0.005em;
  display:block; white-space:nowrap; }
.lockup .lk-yr{ color:var(--flag-bright); }
.lockup .lk-yr sup{ font-size:0.62em; vertical-align:baseline;
  position:relative; top:-0.42em; }
.lockup .lk-main{ font-size:var(--lockup-cap); letter-spacing:0.004em;
  display:block; white-space:nowrap; }
</style>
</head>
<body>
<div class="banner" data-side="1-logo-alt">
  <div class="main">
<div class="guitarwrap">
      <img src="assets/guitar-bird-final.png" width="2040" height="4752" alt="PorchFest guitar with dove" />
    </div>
    <div class="lockup">
      <span class="lk-top">Senoia&rsquo;s <span class="lk-yr">5<sup>th</sup> Annual</span></span>
      <span class="lk-main">PorchFest</span>
    </div>
    <div class="bottom-credits">
      <div class="rule"></div>
      <div class="tagline">29 porches. All day music.</div>
      <div class="presented">Presented by the Senoia Downtown Development Authority</div>
    </div>
  </div>
  <div class="footer">
    <div class="qrbox">
      <img src="qr/qr-home.svg" width="900" height="900" alt="QR code to senoiaporchfest.org" />
    </div>
    <div class="footcopy">
      <div class="foot-url">senoiaporchfest.org</div>
      <div class="foot-caption">Full Lineup &amp; Interactive Map</div>
    </div>
  </div>
</div>
</body>
</html>
